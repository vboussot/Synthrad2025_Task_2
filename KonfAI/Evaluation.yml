# MAE, PSNR and SSIM of the predictions inside the patient mask, against the reference CT.
# The reference of these models is the CT registered to the CBCT by the challenge organizers' deformable
# registration (the leaderboard convention): save it as CT.mha next to CBCT.mha and MASK.mha.
Evaluator:
  metrics:
    sCT:
      targets_criterions:
        CT;MASK:
          criterions_loader:
            MAE:
              reduction: mean
            PSNR:
              dynamic_range: None
            SSIM:
              dynamic_range: None
  Dataset:
    groups_src:
      CT:
        groups_dest:
          CT:
            transforms: None
      sCT:
        groups_dest:
          sCT:
            transforms: None
      MASK:
        groups_dest:
          MASK:
            transforms: None
    subset: None
    dataset_filenames:
    - ./Dataset/AB:a:mha
    - ./Dataset/TH:a:mha
    - ./Dataset/HN:a:mha
    - ./Predictions/Out/Dataset:i:mha
    validation: None
  train_name: Out
