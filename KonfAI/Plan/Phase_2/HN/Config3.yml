Trainer:
  Model:
    classpath: UNetpp:UNetpp
    UNetpp:
      schedulers:
        StepLR:
          step_size: 4
          gamma: 0.75
          last_epoch: -1
          nb_step: 0
      outputs_criterions:
        Head:Tanh:
          targets_criterions:
            CT:
              criterions_loader:
                MAE:
                  schedulers:
                    Constant:
                      nb_step: 0
                      value: 1
                  is_loss: true
                  group: 0
                  start: 0
                  stop: None
                  accumulation: false
                  reduction: mean
                SAM_Perceptual:
                  is_loss: true
                  group: 0
                  start: 0
                  stop: None
                  accumulation: false
                  train: true
                  model_name: SAM2.1_Small.pt
                  weights:
                  - 1
                  - 1
                  - 1
                  schedulers:
                    Constant:
                      nb_step: 0
                      value: 1
            CT;MASK:
              criterions_loader:
                MAE:
                  schedulers:
                    Constant:
                      nb_step: 0
                      value: 1
                  is_loss: false
                  group: 0
                  start: 0
                  stop: None
                  accumulation: false
                  reduction: mean
      pretrained: false
      optimizer:
        name: AdamW
        lr: 0.001
        betas:
        - 0.9
        - 0.999
        eps: 1e-08
        weight_decay: 0.001
        amsgrad: false
        maximize: false
        foreach: None
        capturable: false
        differentiable: false
        fused: None
    allow_head_resize: false
    pretrained_from: None
  Dataset:
    groups_src:
      MASK:
        groups_dest:
          MASK:
            transforms: None
            patch_transforms: None
            is_input: false
      CT_ELASTIX:
        groups_dest:
          CT:
            transforms:
              Statistics: {}
            patch_transforms: None
            is_input: false
      CBCT:
        groups_dest:
          CBCT:
            transforms: None
            patch_transforms: None
            is_input: true
    augmentations:
      DataAugmentation_0:
        data_augmentations:
          Flip:
            f_prob:
            - 0
            - 0.5
            - 0.5
            prob: 1
        nb: 1
    Patch:
      patch_size:
      - 1
      - 256
      - 256
      overlap: None
      pad_value: -1
      extend_slice: 2
      mode: tile
      max_voxels: None
      vram_bytes_per_voxel: None
      ram_bytes_per_voxel: None
    subset: ~./KonfAI/Validation_split/Elastix/Exclude.txt
    shuffle: true
    dataset_filenames:
    - ./Dataset/Train/Task_2/HN:a:mha
    inline_augmentations: true
    batch_size: 32
    validation: ./KonfAI/Validation_split/Elastix/CrossValidation_3.txt
    shuffle_window: None
    memory_budget: None
    validation_augmentations: false
    num_workers: None
    pin_memory: false
    prefetch_factor: None
    persistent_workers: None
  train_name: Phase_2/HN/CrossValidation_3
  manual_seed: 32
  epochs: 100
  it_validation: 2000
  it_lr_update: 2000
  autocast: false
  gradient_checkpoints: None
  gpu_checkpoints: None
  ema_decay: 0
  data_log:
  - CT/IMAGES/5
  - CBCT/IMAGES/5
  - Head:Tanh/IMAGES/5
  save_checkpoint_mode: ALL
  EarlyStopping:
    monitor: []
    patience: 30
    min_delta: 0.0
    mode: min
  channels_last: false
  cudnn_benchmark: false
  torch_compile: false
